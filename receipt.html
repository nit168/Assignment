<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Receipt</title>

    <link
        rel="stylesheet"
        href="CSS/receipt.css"
    >

</head>

<body>

    <div class="receipt">

        <h2 class="title">
            RECEIPTIFY
        </h2>

        <p>
            ORDER SUMMARY
        </p>

        <hr>


        <!-- =====================================
             ORDER LIST
        ====================================== -->

        <ul id="orderList"></ul>


        <hr>


        <!-- =====================================
             ITEM COUNT
        ====================================== -->

        <p>
            ITEM COUNT:
            <span id="itemCount">0</span>
        </p>


        <!-- =====================================
             TOTAL
        ====================================== -->

        <p>
            TOTAL:
            <span id="total">$0.00</span>
        </p>


        <hr>


        <!-- =====================================
             PAYMENT
        ====================================== -->

        <p>
            CARD: **** **** **** 4321
        </p>

        <p>
            AUTH CODE: 654321
        </p>

        <p>
            STATUS: PAID
        </p>


        <hr>


        <!-- =====================================
             THANK YOU
        ====================================== -->

        <div class="thank">

            <h3>
                THANK YOU!
            </h3>

            <p>
                HOPE YOU ENJOY WITH PERFUME
            </p>

        </div>

    </div>


    <script src="Javascript/receipt.js"></script>

</body>

</html>
