<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Checkout</title>
    <!-- ភ្ជាប់ទៅកាន់ CSS របស់ទំព័រ Contact (បើមាន) -->
    <link rel="stylesheet" href="CSS/contect.css"> 
</head>
<body>

    <header>
        <div class="logo">Perfume Elegance</div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contect.html">Contact Us</a></li>
          </ul>
        </nav>
    </header>

    <div class="main-wrapper">
        <div class="checkout-container">
            <h2>CONTACT & SHIPPING INFO</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address:</label>
                    <input type="text" id="address" required placeholder="Enter your address">
                </div>

                <!-- 💡 ខ្ញុំបានបន្ថែម id="thankYouBtn" ចូលត្រង់នេះរួចរាល់ហើយ -->
                <button type="submit" id="thankYouBtn" class="submit-btn">SEND</button>
            </form>
        </div>
    </div> 

    <!-- ភ្ជាប់ទៅកាន់ឯកសារ JavaScript រួមគ្នា -->
    <script src="Javascript/contect.js"></script>
</body>
</html>
